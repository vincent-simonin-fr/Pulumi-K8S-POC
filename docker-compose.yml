# ─────────────────────────────────────────────────────────────────────────────
# Ecommerce – stack de développement local (Podman Compose)
# Usage : podman-compose up -d
# ─────────────────────────────────────────────────────────────────────────────

networks:
  ecommerce-net:
    driver: bridge

volumes:
  order-db-data:
  inventory-db-data:
  rabbitmq-data:
  prometheus-data:

services:
  # ── Bases de données ────────────────────────────────────────────────────────
  order-db:
    image: postgres:16-alpine
    container_name: order-db
    environment:
      POSTGRES_DB: order_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - order-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ecommerce-net

  inventory-db:
    image: postgres:16-alpine
    container_name: inventory-db
    environment:
      POSTGRES_DB: inventory_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - inventory-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ecommerce-net

  # ── Messaging ───────────────────────────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:4.3.1-management-alpine
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
      RABBITMQ_ERLANG_COOKIE: "ecommerce-secret-cookie"
      ERL_FLAGS: "-setcookie ecommerce-secret-cookie"
    ports:
      - "5672:5672"
      - "15672:15672" # Management UI
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ecommerce-net

  # ── Services applicatifs ────────────────────────────────────────────────────
  order-api:
    build:
      context: .
      dockerfile: docker/order-api/Dockerfile
    container_name: order-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__OrderDb: "Host=order-db;Port=5432;Database=order_db;Username=postgres;Password=postgres"
      RabbitMQ__Host: rabbitmq
      RabbitMQ__VirtualHost: /
      RabbitMQ__Username: guest
      RabbitMQ__Password: guest
      OpenTelemetry__Endpoint: http://otel-collector:4317
    ports:
      - "5001:8080"
    depends_on:
      order-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - ecommerce-net

  inventory-api:
    build:
      context: .
      dockerfile: docker/inventory-api/Dockerfile
    container_name: inventory-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__InventoryDb: "Host=inventory-db;Port=5432;Database=inventory_db;Username=postgres;Password=postgres"
      RabbitMQ__Host: rabbitmq
      RabbitMQ__VirtualHost: /
      RabbitMQ__Username: guest
      RabbitMQ__Password: guest
      Reservation__TtlMinutes: "10"
      Reservation__CheckIntervalSeconds: "30"
      OpenTelemetry__Endpoint: http://otel-collector:4317
    ports:
      - "5002:8080"
    depends_on:
      inventory-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - ecommerce-net

  gateway:
    build:
      context: .
      dockerfile: docker/gateway/Dockerfile
    container_name: gateway
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      OpenTelemetry__Endpoint: http://otel-collector:4317
    ports:
      - "8080:8080"
    depends_on:
      - order-api
      - inventory-api
      - otel-collector
    networks:
      - ecommerce-net

  # ── Observabilité ──────────────────────────────────────────────────────────
  # Même pipeline que Kubernetes : APIs → OTel Collector → Jaeger (traces)
  #                                                       → Prometheus (métriques)
  #                                                       → Grafana (dashboards)
  jaeger:
    image: jaegertracing/all-in-one:1.76.0
    container_name: jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      MEMORY_MAX_TRACES: "50000"
    ports:
      - "16686:16686"   # UI → http://localhost:16686
    networks:
      - ecommerce-net

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.153.0
    container_name: otel-collector
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./docker/observability/otel-collector-config.yaml:/etc/otel/config.yaml:ro
    ports:
      - "4317:4317"     # OTLP gRPC (utilisé par les APIs)
      - "4318:4318"     # OTLP HTTP
    depends_on:
      - jaeger
    networks:
      - ecommerce-net

  prometheus:
    image: prom/prometheus:v3.11.3
    container_name: prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
    volumes:
      - ./docker/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - otel-collector
    networks:
      - ecommerce-net

  grafana:
    image: grafana/grafana:13.0.1-security-01
    container_name: grafana
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./docker/observability/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
      - ./docker/observability/dashboards/provider.yaml:/etc/grafana/provisioning/dashboards/provider.yaml:ro
      - ./docker/observability/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"     # UI → http://localhost:3000
    depends_on:
      - prometheus
      - jaeger
    networks:
      - ecommerce-net

  # ── postgres_exporter ───────────────────────────────────────────────────────
  postgres-exporter-order:
    image: prometheuscommunity/postgres-exporter:v0.16.0
    container_name: postgres-exporter-order
    environment:
      DATA_SOURCE_URI: "order-db:5432/order_db?sslmode=disable"
      DATA_SOURCE_USER: postgres
      DATA_SOURCE_PASS: postgres
    ports:
      - "9187:9187"
    depends_on:
      order-db:
        condition: service_healthy
    networks:
      - ecommerce-net

  postgres-exporter-inventory:
    image: prometheuscommunity/postgres-exporter:v0.16.0
    container_name: postgres-exporter-inventory
    environment:
      DATA_SOURCE_URI: "inventory-db:5432/inventory_db?sslmode=disable"
      DATA_SOURCE_USER: postgres
      DATA_SOURCE_PASS: postgres
    ports:
      - "9188:9187"
    depends_on:
      inventory-db:
        condition: service_healthy
    networks:
      - ecommerce-net
