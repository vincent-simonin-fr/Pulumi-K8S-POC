apiVersion: 1
datasources:
  # uid FIXE : permet aux dashboards provisionnés de pointer la datasource de façon
  # déterministe ("uid": "prometheus" en dur). Sans uid fixe, Grafana en génère un
  # aléatoire au démarrage → les dashboards from-scratch tombent en "no data".
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  - name: Jaeger
    uid: jaeger
    type: jaeger
    access: proxy
    url: http://jaeger:16686
    editable: false
