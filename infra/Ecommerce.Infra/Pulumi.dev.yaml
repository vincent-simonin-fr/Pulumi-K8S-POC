config:
  # Images Docker (Podman préfixe les images locales avec localhost/)
  # ⚠️ Ces 3 valeurs sont gérées automatiquement par `dotnet nuke BuildImages` :
  #    le script calcule un tag {SemVer}-{SHA-par-service} et fait `pulumi config set`.
  #    Les valeurs ":dev" ci-dessous ne servent que de fallback au tout premier build
  #    (avant le premier passage du script). Ne pas les éditer à la main ensuite.
  orderApi:image: localhost/ecommerce/order-api:1.0.0-30e7e62
  inventoryApi:image: localhost/ecommerce/inventory-api:1.0.0-800a3a1
  gateway:image: localhost/ecommerce/gateway:1.0.0-f2473ab-dirty
  # Port NodePort exposé sur Kind
  gateway:nodePort: "30080"
  # Réservation de stock
  reservation:ttlMinutes: "10"
  reservation:checkIntervalSeconds: "30"
  # Nombre de réplicas fixes (ignoré si HPA activé)

  # ⚠️ rabbitmq : garder à 1 sans réplication configurée

  # ⚠️ db : obsolète (remplacé par cnpg:orderInstances / cnpg:inventoryInstances)
  replicas:orderApi: "1"
  replicas:inventoryApi: "1"
  replicas:gateway: "1"
  replicas:rabbitmq: "1"
  # Resources CPU/mémoire par container

  # request = garanti par le scheduler   |  limit = plafond (OOMKill si dépassé)

  # Format CPU : "100m" = 0.1 core       |  Format mémoire : "128Mi"
  # CpuRequest 200m : le bruit de fond .NET (GC + health probes) consomme ~60m.
  # Avec une request de 100m, le seuil HPA (70% = 70m) était frôlé au repos →
  # flapping 1↔2 sans trafic. 200m éloigne le seuil (140m) du repos.
  resources:orderApiCpuRequest: "200m"
  resources:orderApiCpuLimit: "750m"
  resources:orderApiMemoryRequest: "192Mi"
  resources:orderApiMemoryLimit: "384Mi"
  resources:inventoryApiCpuRequest: "200m"
  resources:inventoryApiCpuLimit: "1000m"
  resources:inventoryApiMemoryRequest: "192Mi"
  resources:inventoryApiMemoryLimit: "512Mi"
  resources:gatewayCpuRequest: "50m"
  resources:gatewayCpuLimit: "500m"
  resources:gatewayMemoryRequest: "128Mi"
  resources:gatewayMemoryLimit: "256Mi"
  # ── Secrets (External Secrets Operator) ─────────────────────────────────

  # Les valeurs ci-dessous sont des DÉFAUTS pour le développement local.

  # En production, utilisez pulumi config set --secret pour chiffrer les valeurs :

  #

  #   pulumi config set --secret secrets:orderDbPassword     <mot_de_passe>

  #   pulumi config set --secret secrets:inventoryDbPassword <mot_de_passe>

  #   pulumi config set --secret secrets:rabbitmqPassword    <mot_de_passe>

  #

  # Ces commandes chiffrent la valeur dans ce fichier (format "secure: <encrypted>").

  # Les clés non sensibles (user, name) peuvent rester en clair.
  secrets:orderDbUser: app # user 'app' = owner CNPG (pas postgres superuser)
  secrets:orderDbName: order_db
  secrets:inventoryDbUser: app # user 'app' = owner CNPG (pas postgres superuser)
  secrets:inventoryDbName: inventory_db
  secrets:rabbitmqUser: guest
  # ⚠️ Ne pas commiter les mots de passe en clair — utiliser --secret (voir ci-dessus)

  # secrets:orderDbPassword: <chiffré par pulumi config set --secret>

  # secrets:inventoryDbPassword: <chiffré par pulumi config set --secret>

  # secrets:rabbitmqPassword: <chiffré par pulumi config set --secret>

  # Ingress — désactivé en dev (NodePorts utilisés directement)
  ingress:enabled: "false"
  # Observabilite — OTel Collector + Jaeger + Prometheus + Grafana

  # NodePorts exposes sur l'hote via Kind extraPortMappings (kind-config.yaml).
  observability:grafanaNodePort: "30030"
  observability:jaegerNodePort: "30686"
  observability:otelVersion: "0.153.0"
  observability:jaegerVersion: "1.76.0"
  observability:prometheusVersion: "v3.11.3"
  observability:grafanaVersion: "13.0.1-security-01"
  # ── Mode presale (flash sale, promo, événement) ─────────────────────────

  # Quand activé, les HPA sont forcés au minReplicas presale AVANT le pic.

  # Les pods sont déjà en place → pas de cold-start pendant le flash sale.

  #

  # Workflow :

  #   Avant : pulumi config set presale:enabled true  && pulumi up --yes

  #   Après : pulumi config set presale:enabled false && pulumi up --yes

  #

  # Alternative immédiate (sans pulumi up) :

  #   dotnet nuke PresaleStart

  #   dotnet nuke PresaleStop
  presale:enabled: "false"
  presale:inventoryApiMin: "3" # pods inventory-api en attente du pic
  presale:orderApiMin: "3" # pods order-api en attente du pic
  presale:gatewayMin: "2" # pods gateway en attente du pic
  # ── Metrics Server — métriques CPU/mémoire pour HPA et kubectl top ─────

  # Installé automatiquement par Pulumi via Helm (MetricsServerResources.cs).

  # Plus besoin d'étape manuelle post-déploiement.

  #

  # kubeletInsecureTls : true  = dev Kind (kubelets sans IP SANs dans les certs TLS)

  #                      false = prod     (kubelets avec certs signés par le cluster CA)

  #

  # Version du chart Helm : 3.12.2 → Metrics Server v0.7.2

  # Correspondances : https://github.com/kubernetes-sigs/metrics-server/releases
  metricsServer:version: "3.12.2"
  metricsServer:kubeletInsecureTls: "true"
  # HPA — HorizontalPodAutoscaler (order-api + gateway uniquement)

  # inventory-api est géré par KEDA (voir section keda ci-dessous) — pas de HPA natif.

  # Le Metrics Server ci-dessus est obligatoire pour que les métriques CPU soient lisibles.
  hpa:orderApiEnabled: "true"
  hpa:orderApiMin: "1"
  hpa:orderApiMax: "8"
  hpa:orderApiCpu: "70"
  hpa:gatewayEnabled: "true"
  hpa:gatewayMin: "1"
  hpa:gatewayMax: "8"
  hpa:gatewayCpu: "70"
  # ── CNPG — CloudNativePG Operator + Clusters + Poolers ────────────────

  # CNPG remplace les StatefulSets PostgreSQL par des clusters gérés.

  # Chaque cluster dispose d'un Pooler PgBouncer (session mode) devant lui.

  #

  # Dev (Kind mono-nœud) : 1 instance par cluster, 1 pooler.

  # Prod recommandé : 3 instances (1 primary + 2 replicas), 2 poolers.

  #

  # Services créés automatiquement par CNPG :

  #   {cluster}-rw     → primary (init containers + postgres_exporter)

  #   {cluster}-ro     → replicas (lectures optionnelles)

  #   {cluster}-pooler → PgBouncer (connection strings ASP.NET Core)

  #

  # cnpg:version = VERSION DU CHART HELM (pas de l'opérateur).

  # Correspondance chart => opérateur :

  #   0.22.0 => opérateur 1.24.0  (BUG: efface le mot de passe postgres à chaque reconciliation)

  #   0.23.x => opérateur 1.25.x  (bug corrigé)

  #   0.28.x => opérateur 1.29.x  (latest stable)
  cnpg:version: "0.23.2"
  cnpg:orderInstances: "3" # pods postgres order-db   (dev=1, prod=3)
  cnpg:inventoryInstances: "3" # pods postgres inventory-db
  cnpg:poolerInstances: "2" # pods PgBouncer par cluster (dev=1, prod=2)
  # ── KEDA — Kubernetes Event-Driven Autoscaling (inventory-api) ─────────

  # KEDA scale inventory-api sur la profondeur de la queue RabbitMQ.

  # Réaction : ~5 s (vs ~75 s pour HPA CPU) — scaling intent-based, pas consequence-based.

  #

  # Architecture :

  #   ProductAddedToCartEvent → queue RabbitMQ → KEDA détecte depth > queueLength

  #     → scale-out inventory-api (pods Ready en ~30 s avec init container)

  #

  # Nom de la queue : MassTransit KebabCaseEndpointNameFormatter (configuré dans

  # Inventory.Infrastructure/DependencyInjection.cs) produit "product-added-to-cart".

  # ⚠️ DefaultEndpointNameFormatter produirait "ProductAddedToCart" (PascalCase) — ne pas confondre.

  # Vérifier dans l'UI RabbitMQ (http://localhost:15672 → Queues) après démarrage.
  keda:version: "2.17.0"
  keda:queueName: "product-added-to-cart"
  keda:queueLength: "5" # messages par réplica → scale-out si queue > N*replicas
  keda:inventoryApiMin: "1" # minReplicaCount du ScaledObject (aussi utilisé par presale:inventoryApiMin)
  keda:inventoryApiMax: "8" # 8×15 pool = 120 connexions, sous max_connections=400 (marge confortable)
  keda:pollingInterval: "5" # secondes entre chaque lecture de la queue
  keda:cooldownPeriod: "60" # secondes d'inactivité avant que KEDA demande le scale-in au HPA
  keda:scaleDownWindow: "240" # fenêtre de stabilisation HPA pour le scale-in (≈ temps total = cooldown + window)
  # ── Argo CD — GitOps Continuous Delivery ────────────────────────────────

  # Argo CD surveille un repo Git et réconcilie l'état du cluster.

  # Accès dev : kubectl port-forward -n argocd svc/argocd-server 8080:80

  #             → http://localhost:8080  (admin / voir argocd-initial-admin-secret)

  # Accès prod : https://argocd.{ingress:domain}

  #

  # Mot de passe admin (production) :

  #   Générer le hash : htpasswd -nbBC 10 "" monMotDePasse | tr -d ':\n'

  #   Définir         : pulumi config set --secret argocd:adminPasswordHash <hash>

  #   Sans cette clé  : Argo CD génère un mot de passe aléatoire au premier démarrage.

  #                     kubectl -n argocd get secret argocd-initial-admin-secret \

  #                       -o jsonpath="{.data.password}" | base64 -d

  #

  # Scaling prod HA (multi-nœuds) :

  #   argocd:serverReplicas: "2"         → UI + API stateless

  #   argocd:repoServerReplicas: "2"     → clone Git, render Helm/Kustomize

  #   argocd:applicationSetReplicas: "2" → leader election intégré

  #

  # Correspondance chart → Argo CD :

  #   7.7.x → Argo CD 2.13.x

  #   7.8.x → Argo CD 2.14.x
  argocd:version: "7.8.3"
  argocd:serverReplicas: "1" # dev=1 | prod HA=2
  argocd:repoServerReplicas: "1" # dev=1 | prod HA=2
  argocd:applicationSetReplicas: "1" # dev=1 | prod HA=2
  # argocd:adminPasswordHash: ""          # bcrypt hash — utiliser --secret en production

  gitops:enabled: "true"
  gitops:outputDir: "../../gitops/apps"
  gitops:path: "gitops/apps"
  gitops:targetRevision: "main"
  gitops:repoUrl: https://github.com/vincent-simonin-fr/Pulumi-K8S-POC.git
