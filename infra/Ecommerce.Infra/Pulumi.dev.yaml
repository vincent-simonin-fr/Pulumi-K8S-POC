config:
  # Images Docker (Podman préfixe les images locales avec localhost/)
  orderApi:image: localhost/ecommerce/order-api:dev
  inventoryApi:image: localhost/ecommerce/inventory-api:dev
  gateway:image: localhost/ecommerce/gateway:dev

  # Port NodePort exposé sur Kind
  gateway:nodePort: "30080"

  # Réservation de stock
  reservation:ttlMinutes: "10"
  reservation:checkIntervalSeconds: "30"

  # Nombre de réplicas fixes (ignoré si HPA activé)
  # ⚠️ db et rabbitmq : garder à 1 sans réplication configurée
  replicas:orderApi: "1"
  replicas:inventoryApi: "1"
  replicas:gateway: "1"
  replicas:db: "1"
  replicas:rabbitmq: "1"

  # Resources CPU/mémoire par container
  # request = garanti par le scheduler   |  limit = plafond (OOMKill si dépassé)
  # Format CPU : "100m" = 0.1 core       |  Format mémoire : "128Mi"
  resources:orderApiCpuRequest: "100m"
  resources:orderApiCpuLimit: "500m"
  resources:orderApiMemoryRequest: "128Mi"
  resources:orderApiMemoryLimit: "256Mi"

  resources:inventoryApiCpuRequest: "100m"
  resources:inventoryApiCpuLimit: "500m"
  resources:inventoryApiMemoryRequest: "128Mi"
  resources:inventoryApiMemoryLimit: "256Mi"

  resources:gatewayCpuRequest: "50m"
  resources:gatewayCpuLimit: "250m"
  resources:gatewayMemoryRequest: "64Mi"
  resources:gatewayMemoryLimit: "128Mi"

  # ── Secrets (External Secrets Operator) ─────────────────────────────────
  # Les valeurs ci-dessous sont des DÉFAUTS pour le développement local.
  # En production, utilisez pulumi config set --secret pour chiffrer les valeurs :
  #
  #   pulumi config set --secret secrets:orderDbPassword     <mot_de_passe>
  #   pulumi config set --secret secrets:inventoryDbPassword <mot_de_passe>
  #   pulumi config set --secret secrets:rabbitmqPassword    <mot_de_passe>
  #
  # Ces commandes chiffrent la valeur dans ce fichier (format "secure: <encrypted>").
  # Les clés non sensibles (user, name) peuvent rester en clair.
  secrets:orderDbUser: postgres
  secrets:orderDbName: order_db
  secrets:inventoryDbUser: postgres
  secrets:inventoryDbName: inventory_db
  secrets:rabbitmqUser: guest
  # ⚠️ Ne pas commiter les mots de passe en clair — utiliser --secret (voir ci-dessus)
  # secrets:orderDbPassword: <chiffré par pulumi config set --secret>
  # secrets:inventoryDbPassword: <chiffré par pulumi config set --secret>
  # secrets:rabbitmqPassword: <chiffré par pulumi config set --secret>

  # Ingress — désactivé en dev (NodePorts utilisés directement)
  ingress:enabled: "false"

  # Observabilite — OTel Collector + Jaeger + Prometheus + Grafana
  # NodePorts exposes sur l'hote via Kind extraPortMappings (kind-config.yaml).
  observability:grafanaNodePort:   "30030"
  observability:jaegerNodePort:    "30686"
  observability:otelVersion:       "0.153.0"
  observability:jaegerVersion:     "1.76.0"
  observability:prometheusVersion: "v3.11.3"
  observability:grafanaVersion:    "13.0.1-security-01"

  # ── Mode presale (flash sale, promo, événement) ─────────────────────────
  # Quand activé, les HPA sont forcés au minReplicas presale AVANT le pic.
  # Les pods sont déjà en place → pas de cold-start pendant le flash sale.
  #
  # Workflow :
  #   Avant : pulumi config set presale:enabled true  && pulumi up --yes
  #   Après : pulumi config set presale:enabled false && pulumi up --yes
  #
  # Alternative immédiate (sans pulumi up) :
  #   scripts\presale.cmd start
  #   scripts\presale.cmd stop
  presale:enabled: "false"
  presale:inventoryApiMin: "3"   # pods inventory-api en attente du pic
  presale:orderApiMin: "3"       # pods order-api en attente du pic
  presale:gatewayMin: "2"        # pods gateway en attente du pic

  # HPA — HorizontalPodAutoscaler (order-api + gateway uniquement)
  # ⚠️ inventory-api n'utilise plus l'HPA natif — KEDA gère son scaling (voir section keda ci-dessous).
  # ⚠️ Requiert que le Metrics Server soit installé dans le cluster :
  #   kubectl apply -f https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml
  #   kubectl patch deployment metrics-server -n kube-system --type='json' \
  #     -p='[{"op":"add","path":"/spec/template/spec/containers/0/args/-","value":"--kubelet-insecure-tls"}]'
  hpa:orderApiEnabled: "true"
  hpa:orderApiMin: "1"
  hpa:orderApiMax: "4"
  hpa:orderApiCpu: "70"
  # hpa:orderApiMemory: "80"   # optionnel — décommenter pour scaler sur la mémoire aussi

  # hpa:inventoryApiEnabled / inventoryApiMin / inventoryApiMax : ignorés (KEDA gère inventory-api)
  hpa:inventoryApiMin: "1"   # utilisé par PresaleMin() comme valeur nominale

  hpa:gatewayEnabled: "true"
  hpa:gatewayMin: "1"
  hpa:gatewayMax: "3"
  hpa:gatewayCpu: "70"
  # hpa:gatewayMemory: "80"

  # ── KEDA — Kubernetes Event-Driven Autoscaling (inventory-api) ─────────
  # KEDA scale inventory-api sur la profondeur de la queue RabbitMQ.
  # Réaction : ~5 s (vs ~75 s pour HPA CPU) — scaling intent-based, pas consequence-based.
  #
  # Architecture :
  #   ProductAddedToCartEvent → queue RabbitMQ → KEDA détecte depth > queueLength
  #     → scale-out inventory-api (pods Ready en ~30 s avec init container)
  #
  # Nom de la queue : MassTransit KebabCaseEndpointNameFormatter (configuré dans
  # Inventory.Infrastructure/DependencyInjection.cs) produit "product-added-to-cart".
  # ⚠️ DefaultEndpointNameFormatter produirait "ProductAddedToCart" (PascalCase) — ne pas confondre.
  # Vérifier dans l'UI RabbitMQ (http://localhost:15672 → Queues) après démarrage.
  keda:version: "2.17.0"
  keda:queueName: "product-added-to-cart"
  keda:queueLength: "5"          # messages par réplica → scale-out si queue > N*replicas
  keda:inventoryApiMax: "4"      # plafond Kind mono-nœud (8×pool=800 dépasse max_connections=100 PG)
  keda:pollingInterval: "5"      # secondes entre chaque lecture de la queue
  keda:cooldownPeriod: "60"      # secondes d'inactivité avant scale-in
