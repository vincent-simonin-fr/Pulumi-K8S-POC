kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
# ─────────────────────────────────────────────────────────────────────────────
#  Cluster Kind MULTI-NŒUDS — pour tester la HA (anti-affinité, CNPG/RabbitMQ
#  cluster, failover par drain de nœud) que le mono-nœud ne peut pas valider.
#
#  Topologie : 1 control-plane + 3 workers.
#    - Le control-plane porte les extraPortMappings (NodePort accessibles via
#      localhost) : kube-proxy y route vers les pods, quel que soit leur nœud.
#    - Les 3 workers reçoivent les pods applicatifs (le control-plane est tainté
#      NoSchedule par défaut → il ne porte pas la charge).
#
#  ⚠️ Ces "nœuds" sont des conteneurs sur le MÊME laptop : on teste le scheduling
#     et le failover LOGIQUE (cordon/drain), pas une vraie panne matérielle. Le
#     CPU/RAM physique reste partagé → perfs applicatives moindres qu'en mono-nœud
#     allégé. C'est attendu : l'objectif ici est la HA, pas le débit.
#
#  Usage :
#    kind create cluster --name ecommerce --config kind-config-multinode.yaml
#    (KIND_EXPERIMENTAL_PROVIDER=podman)
#
#  Note : `kind load docker-image ... --name ecommerce` charge sur TOUS les nœuds
#  par défaut → aucun changement nécessaire au préchargement (Nuke / script).
# ─────────────────────────────────────────────────────────────────────────────
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080   # gateway
        hostPort: 30080
        protocol: TCP
      - containerPort: 30030   # grafana
        hostPort: 30030
        protocol: TCP
      - containerPort: 30686   # jaeger
        hostPort: 30686
        protocol: TCP
  - role: worker
  - role: worker
  - role: worker
