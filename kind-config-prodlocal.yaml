# Cluster Kind « prod-like » : Ingress local (80/443) au lieu des NodePort applicatifs.
# Utilisé pour tester l'Ingress + TLS self-signed en local (cf. docs/ingress-local.md).
#   kind create cluster --name ecommerce --config kind-config-prodlocal.yaml
#
# 80/443  : exposés sur localhost → nginx-ingress (controller.hostPort) y répond.
# 30820   : conservé pour le NodePort Vault (le provider pulumi-vault joint Vault en local).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
- role: control-plane
  extraPortMappings:
  - containerPort: 80
    hostPort: 80
    protocol: TCP
  - containerPort: 443
    hostPort: 443
    protocol: TCP
  - containerPort: 30820
    hostPort: 30820
    protocol: TCP
