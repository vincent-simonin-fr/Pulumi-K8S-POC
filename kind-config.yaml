kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
- role: control-plane
  extraPortMappings:
  - containerPort: 30080
    hostPort: 30080
    protocol: TCP
  - containerPort: 30030
    hostPort: 30030
    protocol: TCP
  - containerPort: 30686
    hostPort: 30686
    protocol: TCP
  # Vault (UI/API) — exposé en dev pour le provider pulumi-vault (configMode=provider)
  - containerPort: 30820
    hostPort: 30820
    protocol: TCP
